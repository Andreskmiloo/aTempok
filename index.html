<title>A Tiempo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Disposición: mapa a pantalla completa. En teléfono, buscador arriba, panel deslizable abajo y pestañas al pie.
   En pantallas anchas el panel pasa a ser una columna flotante a la izquierda. Colores sólidos, grafito como marca. */
:root {
  --fondo: #f2f2f4;
  --superficie: #ffffff;
  --superficie2: #f2f2f5;
  --superficie3: #e6e6ea;
  --texto: #1d1d1f;
  --texto2: #6a6a70;
  --linea: #e2e2e6;
  --marca: #1d1d1f;
  --sobre-marca: #ffffff;
  --foco: #0a66d8;
  --verde: #178a4a;
  --verde-suave: #e2f4e9;
  --naranja: #b95f00;
  --naranja-suave: #fcecd6;
  --rojo: #c8322a;
  --rojo-suave: #fbe4e2;
  --azul: #0a66d8;
  --azul-suave: #e3eefb;
  --sombra: 0 6px 22px rgba(20, 20, 30, .13);
  --sombra-corta: 0 2px 8px rgba(20, 20, 30, .12);
  --letra: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --izq: max(16px, env(safe-area-inset-left, 0px));
  --der: max(16px, env(safe-area-inset-right, 0px));
  --pestanas: 58px;
  --panel-px: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #101012; --superficie: #1c1c1e; --superficie2: #2a2a2d; --superficie3: #3a3a3e;
    --texto: #f5f5f7; --texto2: #a3a3aa; --linea: #38383c; --marca: #f5f5f7; --sobre-marca: #1d1d1f; --foco: #6cb0ff;
    --verde: #3ad27a; --verde-suave: #143421; --naranja: #ffa730; --naranja-suave: #3b2a10;
    --rojo: #ff6a5f; --rojo-suave: #3d1816; --azul: #6cb0ff; --azul-suave: #14283f;
    --sombra: 0 6px 22px rgba(0, 0, 0, .5); --sombra-corta: 0 2px 8px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #101012; --superficie: #1c1c1e; --superficie2: #2a2a2d; --superficie3: #3a3a3e;
  --texto: #f5f5f7; --texto2: #a3a3aa; --linea: #38383c; --marca: #f5f5f7; --sobre-marca: #1d1d1f; --foco: #6cb0ff;
  --verde: #3ad27a; --verde-suave: #143421; --naranja: #ffa730; --naranja-suave: #3b2a10;
  --rojo: #ff6a5f; --rojo-suave: #3d1816; --azul: #6cb0ff; --azul-suave: #14283f;
  --sombra: 0 6px 22px rgba(0, 0, 0, .5); --sombra-corta: 0 2px 8px rgba(0, 0, 0, .45);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.4 var(--letra); overflow: hidden; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

#app { position: relative; height: 100%; overflow: hidden; }
#mapa { position: absolute; inset: 0; }
.maplibregl-map { overflow: hidden; position: relative; }
.maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas-container.maplibregl-interactive { cursor: grab; user-select: none; -webkit-user-select: none; }
.maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas { touch-action: none; }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }
.maplibregl-control-container { display: none; }

/* ---------- arriba: buscador y filtros ---------- */
#arriba { position: absolute; top: 10px; left: var(--izq); right: var(--der); z-index: 5; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
#arriba > * { pointer-events: auto; }
.buscador { height: 50px; width: 100%; display: flex; align-items: center; gap: 11px; padding: 0 14px 0 10px; border: 0; border-radius: 15px; background: var(--superficie); box-shadow: var(--sombra); text-align: left; }
.buscador .logo { width: 32px; height: 32px; flex: none; }
.buscador span { flex: 1; min-width: 0; color: var(--texto2); font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.filtros { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; margin: 0 calc(-1 * var(--der)) 0 calc(-1 * var(--izq)); padding-left: var(--izq); padding-right: var(--der); }
.filtros::-webkit-scrollbar { display: none; }
.filtro { flex: none; height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 13px 0 10px; border: 0; border-radius: 999px; background: var(--superficie); color: var(--texto); box-shadow: var(--sombra-corta); font-size: 13.5px; font-weight: 600; }
.filtro i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.filtro[aria-pressed="true"] { background: var(--marca); color: var(--sobre-marca); }

#elegir { position: absolute; top: 10px; left: var(--izq); right: var(--der); z-index: 8; display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 16px; border-radius: 15px; background: var(--marca); color: var(--sobre-marca); box-shadow: var(--sombra); font-weight: 600; }
#elegir span { flex: 1; min-width: 0; }
#elegir button { height: 34px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--sobre-marca); color: var(--marca); font-weight: 700; font-size: 13.5px; }

#controles { position: absolute; right: var(--der); bottom: calc(var(--pestanas) + var(--panel-px) + 14px); z-index: 4; display: flex; flex-direction: column; gap: 8px; transition: bottom .28s cubic-bezier(.2, .8, .2, 1); }
#controles button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 13px; background: var(--superficie); color: var(--texto); box-shadow: var(--sombra-corta); }
#controles .solo-ancho { display: none; }
#atribucion { position: absolute; left: var(--izq); bottom: calc(var(--pestanas) + var(--panel-px) + 6px); z-index: 3; font-size: 10px; color: var(--texto2); background: var(--superficie); padding: 1px 6px; border-radius: 6px; opacity: .86; transition: bottom .28s cubic-bezier(.2, .8, .2, 1); }

/* ---------- panel ---------- */
#panel { position: absolute; left: 0; right: 0; bottom: var(--pestanas); height: var(--panel-px); z-index: 6; display: flex; flex-direction: column; background: var(--superficie); border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(20, 20, 30, .14); transition: height .28s cubic-bezier(.2, .8, .2, 1); }
#panel.arrastrando { transition: none; }
#asa { flex: none; height: 24px; display: grid; place-items: center; border: 0; background: none; width: 100%; touch-action: none; cursor: grab; }
#asa span { width: 38px; height: 5px; border-radius: 3px; background: var(--superficie3); }
#contenido { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--der) 18px var(--izq); }

#pestanas { position: absolute; left: 0; right: 0; bottom: 0; height: var(--pestanas); z-index: 7; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--superficie); border-top: 1px solid var(--linea); padding: 0 var(--der) 0 var(--izq); }
#pestanas button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; color: var(--texto2); font-size: 11px; font-weight: 600; }
#pestanas button[aria-current="page"] { color: var(--texto); }
#pestanas button[aria-current="page"] svg { stroke-width: 2.4; }

#tostada { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(var(--pestanas) + 16px); z-index: 20; max-width: min(88%, 420px); padding: 11px 16px; border-radius: 13px; background: var(--marca); color: var(--sobre-marca); font-weight: 600; font-size: 14px; box-shadow: var(--sombra); text-align: center; }

/* ---------- piezas del panel ---------- */
.cab { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 4px; }
.cab h2 { flex: 1; min-width: 0; margin: 0; font-size: 21px; line-height: 1.2; font-weight: 750; letter-spacing: -.015em; text-wrap: balance; }
.cab .redondo, .redondo { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--superficie2); color: var(--texto); }
.sub { margin: 0; color: var(--texto2); font-size: 13.5px; }
.seccion { margin: 18px 0 6px; font-size: 13px; font-weight: 700; color: var(--texto2); }
.tarjeta { background: var(--superficie2); border-radius: 18px; padding: 14px 15px; margin: 10px 0; }
.tarjeta.borde { background: var(--superficie); border: 1px solid var(--linea); }
.fila { display: flex; align-items: center; gap: 10px; min-width: 0; }
.fila > .crece { flex: 1; min-width: 0; }
.entre { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.mini { font-size: 12.5px; color: var(--texto2); }
.fuerte { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.grande { font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -.025em; font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.grande.hora { font-size: 27px; }
.verde { color: var(--verde); } .naranja { color: var(--naranja); } .rojo { color: var(--rojo); }
.corta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 25px; padding: 0 8px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 800; letter-spacing: .01em; flex: none; font-variant-numeric: tabular-nums; }
.s0 { background: #d32a2a; } .s1 { background: #2a9440; } .s2 { background: #b3261e; } .s3 { background: #1763c6; }
.s4 { background: #d9730d; } .s5 { background: #8a2346; } .s6 { background: #c2185b; }
.sello { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 700; background: var(--superficie3); color: var(--texto); }
button.sello { border: 0; }
.sello.verde { background: var(--verde-suave); color: var(--verde); }
.sello.naranja { background: var(--naranja-suave); color: var(--naranja); }
.sello.rojo { background: var(--rojo-suave); color: var(--rojo); }
.sello.azul { background: var(--azul-suave); color: var(--azul); }
.sellos { display: flex; flex-wrap: wrap; gap: 6px; }

.boton { height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 13px; font-weight: 650; font-size: 15px; background: var(--superficie3); color: var(--texto); white-space: nowrap; }
.boton.principal { background: var(--marca); color: var(--sobre-marca); }
.boton.claro { background: var(--superficie); }
.boton.chico { height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
.boton.ancho { width: 100%; }
.boton:disabled { opacity: .5; cursor: default; }
.botones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.botones > .boton { flex: 1 1 auto; }
.enlace { border: 0; background: none; padding: 0; color: var(--azul); font-weight: 650; }

.lista { margin: 6px 0; border-radius: 16px; background: var(--superficie2); overflow: hidden; }
.item { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 8px 14px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--linea); }
.item:last-child { border-bottom: 0; }
.item .crece { flex: 1; min-width: 0; }
.item .t { font-weight: 650; }
.icono-lugar { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 11px; background: var(--marca); color: var(--sobre-marca); }
.icono-lugar svg { width: 20px; height: 20px; }
.icono-lugar.gris { background: var(--superficie3); color: var(--texto); }

.campo { display: block; margin: 12px 0; }
.campo > span { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 650; color: var(--texto2); }
.entrada { width: 100%; height: 46px; padding: 0 13px; border: 1.5px solid transparent; border-radius: 13px; background: var(--superficie2); color: var(--texto); font-size: 16px; }
.entrada:focus { outline: none; border-color: var(--foco); }
select.entrada { appearance: none; -webkit-appearance: none; }
.segmentado { display: flex; padding: 3px; border-radius: 12px; background: var(--superficie2); gap: 2px; }
.segmentado button { flex: 1; min-width: 0; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--texto2); font-size: 13.5px; font-weight: 650; white-space: nowrap; }
.segmentado button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: var(--sombra-corta); }
.dias { display: flex; gap: 6px; }
.dias button { flex: 1; min-width: 0; height: 40px; border: 0; border-radius: 11px; background: var(--superficie2); color: var(--texto2); font-weight: 700; }
.dias button[aria-pressed="true"] { background: var(--marca); color: var(--sobre-marca); }

.ruta-ab { display: grid; grid-template-columns: 1fr 44px; gap: 8px; align-items: center; }
.ruta-ab .puntos { display: flex; flex-direction: column; gap: 6px; }
.punto-b { width: 100%; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 0; border-radius: 13px; background: var(--superficie2); text-align: left; }
.punto-b small { width: 44px; flex: none; color: var(--texto2); font-size: 12px; font-weight: 700; }
.punto-b b { flex: 1; min-width: 0; font-weight: 650; }

.opcion { width: 100%; display: block; text-align: left; border: 1.5px solid transparent; }
.opcion[aria-pressed="true"] { border-color: var(--marca); background: var(--superficie); }
.tramos { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; color: var(--texto2); }
.tramos svg.i { width: 18px; height: 18px; }
.pasos { margin: 8px 0 0; padding: 0; list-style: none; }
.pasos li { position: relative; padding: 0 0 16px 28px; }
.pasos li:last-child { padding-bottom: 0; }
.pasos li::before { content: ""; position: absolute; left: 6px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--superficie); border: 3px solid var(--texto2); }
.pasos li::after { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 3px; border-radius: 2px; background: var(--superficie3); }
.pasos li:last-child::after { display: none; }
.pasos li.bus::before { border-color: var(--c, var(--texto)); }
.pasos li.bus::after { background: var(--c, var(--texto)); }
.pasos .t { font-weight: 650; }

.medidor { height: 8px; border-radius: 4px; background: var(--superficie3); overflow: hidden; margin: 8px 0 4px; }
.medidor i { display: block; height: 100%; border-radius: 4px; background: var(--marca); }
.vacio { text-align: center; padding: 22px 8px; color: var(--texto2); }
.bienvenida { text-align: center; padding: 6px 4px 4px; }
.bienvenida .logo { width: 64px; height: 64px; }
.bienvenida h2 { margin: 12px 0 6px; font-size: 24px; letter-spacing: -.02em; text-wrap: balance; }
.bienvenida p { margin: 0 auto 4px; max-width: 34ch; color: var(--texto2); }
.espera { display: flex; align-items: center; gap: 10px; color: var(--texto2); padding: 10px 0; }
.espera i { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--superficie3); border-top-color: var(--texto); animation: giro .8s linear infinite; }
@keyframes giro { to { transform: rotate(360deg); } }

.marca { cursor: pointer; }
.pin { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--marca); color: var(--sobre-marca); border: 3px solid var(--superficie); box-shadow: var(--sombra-corta); }
.pin::after { content: ""; position: absolute; left: 50%; top: 100%; margin: -1px 0 0 -6px; border: 6px solid transparent; border-top: 8px solid var(--marca); border-bottom: 0; }
.pin svg { width: 19px; height: 19px; }
.pin.punto { background: var(--azul); color: #fff; }
.pin.punto::after { border-top-color: var(--azul); }

@media (max-width: 899px) {
  #app[data-panel="max"] #controles, #app[data-panel="max"] #atribucion { display: none; }
}

/* ---------- pantallas anchas ---------- */
@media (min-width: 900px) {
  :root { --panel-px: 0px; --pestanas: 0px; }
  #panel { left: 16px; top: 16px; bottom: 76px; right: auto; width: 400px; height: auto; border-radius: 22px 22px 0 0; box-shadow: var(--sombra); transition: none; }
  #asa { display: none; }
  #contenido { padding: 18px 18px 18px; }
  #pestanas { left: 16px; right: auto; bottom: 16px; width: 400px; height: 60px; border-radius: 0 0 22px 22px; box-shadow: var(--sombra); padding: 0 8px; }
  #arriba, #elegir { left: 432px; right: auto; width: min(440px, calc(100% - 448px)); top: 16px; }
  .filtros { margin: 0; padding-left: 0; padding-right: 0; flex-wrap: wrap; overflow: visible; }
  #controles { right: 16px; bottom: 30px; }
  #controles .solo-ancho { display: grid; }
  #atribucion { left: auto; right: 16px; bottom: 8px; }
  #tostada { left: calc(432px + (100% - 432px) / 2); bottom: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  #panel, #controles, #atribucion { transition: none; }
  .espera i { animation-duration: 2.4s; }
}
</style>
